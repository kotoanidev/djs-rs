[workspace]
resolver = "3"
members = ["crates/*", "benches/vs-node"]

# Shared package metadata — every crate inherits these with `<field>.workspace = true`.
[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.89"
license = "MIT OR Apache-2.0"
repository = "https://github.com/kotoanidev/djs-rs"
homepage = "https://github.com/kotoanidev/djs-rs"
keywords = ["discord", "discord-bot", "discord-api", "discordjs", "async"]
categories = ["api-bindings", "asynchronous", "network-programming"]

# Shared dependency versions. Crates reference these with `dep.workspace = true`.
# Adding a dependency here is a significant decision — see CLAUDE.md.
[workspace.dependencies]
djs-builders = { path = "crates/djs-builders", version = "0.0.0" }
djs-cache = { path = "crates/djs-cache", version = "0.0.0" }
djs-collection = { path = "crates/djs-collection", version = "0.0.0" }
djs-formatters = { path = "crates/djs-formatters", version = "0.0.0" }
djs-gateway = { path = "crates/djs-gateway", version = "0.0.0", default-features = false }
djs-model = { path = "crates/djs-model", version = "0.0.0" }
djs-rest = { path = "crates/djs-rest", version = "0.0.0" }
djs-util = { path = "crates/djs-util", version = "0.0.0" }
djs-voice = { path = "crates/djs-voice", version = "0.0.0" }

# Approved third-party dependencies (D-033). Features are enabled per crate; defaults are off
# wherever possible so every crate only pulls in what it uses.
# Voice transport encryption (D-314): `aead_aes256_gcm_rtpsize`.
aes-gcm = { version = "0.11", default-features = false }
bitflags = "2.13"
bytes = "1.12"
# Voice transport encryption (D-314): `aead_xchacha20_poly1305_rtpsize`.
chacha20poly1305 = { version = "0.11", default-features = false }
compact_str = { version = "0.10", default-features = false }
# The default cache backend (D-016) and its key hasher (D-158).
dashmap = { version = "6.2.1", default-features = false }
# Voice end-to-end encryption (D-312), pinned while it is 0.x.
davey = "=0.2.0"
divan = "0.1.21"
fastrand = "2.5"
flate2 = { version = "1.1.11", default-features = false }
foldhash = { version = "0.2.0", default-features = false, features = ["std"] }
futures-core = { version = "0.3.34", default-features = false }
futures-util = { version = "0.3.34", default-features = false }
http = "1.5"
http-body-util = "0.1.5"
hyper = { version = "1.12", default-features = false }
hyper-rustls = { version = "0.27.10", default-features = false }
hyper-util = { version = "0.1.21", default-features = false }
# The insertion-ordered map behind `Collection` (D-209).
indexmap = { version = "2.14.2", default-features = false, features = ["std"] }
# Dev-dependency only: allocator comparison in the djs-rs stress tests (D-080).
mimalloc = { version = "0.1.52", default-features = false }
rustls = { version = "0.23.46", default-features = false }
# Optional: the `native-roots` feature of djs-rest and djs-gateway (D-088, D-100).
rustls-native-certs = "0.8.5"
serde = { version = "1.0.228", default-features = false }
serde_json = "1.0.154"
thiserror = "2.0.21"
tokio = { version = "1.54", default-features = false }
tokio-rustls = { version = "0.26.6", default-features = false }
tokio-websockets = { version = "0.13.3", default-features = false }
tracing = { version = "0.1.44", default-features = false }
tracing-subscriber = { version = "0.3.23", default-features = false }
webpki-roots = "1.0.11"
zstd = { version = "0.14.3", default-features = false }

[workspace.lints.rust]
unsafe_code = "deny"
missing_docs = "warn"
missing_debug_implementations = "warn"
unreachable_pub = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(docsrs)"] }

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"

[workspace.lints.rustdoc]
broken_intra_doc_links = "deny"
private_intra_doc_links = "warn"
missing_crate_level_docs = "warn"
bare_urls = "warn"

# Profiles below only affect binaries built inside this workspace (examples, benches).
[profile.release]
lto = "fat"
codegen-units = 1

[profile.bench]
inherits = "release"
debug = true
