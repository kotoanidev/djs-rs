[package]
name = "ping-djs-rs"
description = "The smallest djs-rs bot, built (never run) to measure build time, size and dependencies (D-279)."
version = "0.0.0"
edition = "2024"
license = "MIT OR Apache-2.0"
publish = false

# Its own workspace and Cargo.lock, like a bot project of its own.
[workspace]

[dependencies]
djs-rs = { path = "../../../../crates/djs-rs" }
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
