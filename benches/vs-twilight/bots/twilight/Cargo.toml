[package]
name = "ping-twilight"
description = "The smallest twilight bot, built (never run) to measure build time, size and dependencies (D-385)."
version = "0.0.0"
edition = "2024"
license = "MIT OR Apache-2.0"
publish = false

# Its own workspace and Cargo.lock, like a bot project of its own.
[workspace]

[dependencies]
# Default features, as twilight's README uses them.
twilight-cache-inmemory = "=0.18.0"
twilight-gateway = "=0.18.0"
twilight-http = "=0.18.0"
twilight-model = "=0.18.0"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
