[package]
name = "djs-model"
description = "Discord API v10 types — users, guilds, channels, messages, interactions and gateway events."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true
readme = "README.md"
# Not published until the owner decides on a release (see docs/DECISIONS.md, C-003).
publish = false

[dependencies]
bitflags.workspace = true
bytes.workspace = true
compact_str = { workspace = true, features = ["std", "serde"] }
serde = { workspace = true, features = ["std", "derive"] }

[dev-dependencies]
divan.workspace = true
serde_json.workspace = true

[[bench]]
name = "decode"
harness = false

[[bench]]
name = "encode"
harness = false

[lints]
workspace = true

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
