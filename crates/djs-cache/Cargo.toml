[package]
name = "djs-cache"
description = "Configurable, pluggable in-memory cache for Discord entities."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true
readme = "README.md"
# Not published until the owner decides on a release (see docs/DECISIONS.md, C-003).
publish = false

[dependencies]
compact_str = { workspace = true, features = ["std"] }
dashmap.workspace = true
djs-model.workspace = true
foldhash.workspace = true

[dev-dependencies]
serde.workspace = true
serde_json.workspace = true

[lints]
workspace = true

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
