[package]
name = "djs-voice"
description = "Discord voice for djs-rs: calls, tracks and end-to-end encrypted audio (DAVE)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true
readme = "README.md"
# Not published until the owner decides on a release (see docs/DECISIONS.md, C-003).
publish = false

[dependencies]
aes-gcm = { workspace = true, features = ["aes", "alloc"] }
chacha20poly1305 = { workspace = true, features = ["alloc"] }

[lints]
workspace = true

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
