[package]
name = "djs-gateway"
description = "Discord gateway (WebSocket) client with sharding and transport compression."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true
readme = "README.md"
# Not published until the owner decides on a release (see docs/DECISIONS.md, C-003).
publish = false

[dependencies]
djs-model.workspace = true
fastrand.workspace = true
futures-util = { workspace = true, features = ["sink", "std"] }
rustls = { workspace = true, features = ["ring", "std", "tls12"] }
serde = { workspace = true, features = ["std"] }
serde_json.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["macros", "net", "rt", "sync", "time"] }
tokio-rustls = { workspace = true, features = ["ring", "tls12"] }
tokio-websockets = { workspace = true, features = ["client", "fastrand", "ring", "rustls-bring-your-own-connector"] }
tracing = { workspace = true, features = ["std"] }
webpki-roots.workspace = true
zstd = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "test-util"] }
tokio-websockets = { workspace = true, features = ["server"] }

[lints]
workspace = true

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
