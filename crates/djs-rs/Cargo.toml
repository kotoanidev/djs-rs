[package]
name = "djs-rs"
description = "High-level, discord.js-style framework for building Discord bots in Rust."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true
readme = "README.md"
# Not published until the owner decides on a release (see docs/DECISIONS.md, C-003).
publish = false

[features]
default = ["zstd-stream"]
## `zstd-stream` gateway transport compression (D-015).
zstd-stream = ["djs-gateway/zstd-stream"]

[dependencies]
djs-gateway.workspace = true
djs-model.workspace = true
djs-rest.workspace = true
futures-core.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["rt", "sync", "macros"] }
tracing = { workspace = true, features = ["std"] }

[dev-dependencies]
bytes.workspace = true
futures-util = { workspace = true, features = ["sink", "std"] }
http-body-util.workspace = true
hyper = { workspace = true, features = ["server", "http1"] }
hyper-util = { workspace = true, features = ["tokio"] }
serde_json.workspace = true
tokio = { workspace = true, features = ["macros", "net", "rt-multi-thread", "signal", "time"] }
tokio-websockets = { workspace = true, features = ["server", "ring"] }
tracing-subscriber = { workspace = true, features = ["ansi", "env-filter", "fmt", "std"] }

[lints]
workspace = true

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
