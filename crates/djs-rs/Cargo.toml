[package]
name = "djs-rs"
description = "High-level, discord.js-style framework for building Discord bots in Rust."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true
readme = "README.md"

[features]
default = ["gateway", "hyper", "zstd-stream"]
## The REST client's default transport, hyper with rustls (D-405). Without it, give
## `ClientBuilder::rest` a `Rest` built with a `Transport` (for example on Cloudflare Workers).
hyper = ["djs-rest/hyper"]
## The gateway (D-395): `Client::login`, shards, every gateway event, presence and the
## gateway requests (`MemberManager::fetch_all`, …). Without it the client only has REST
## and routes, for HTTP interactions (`http-interactions`), and builds for wasm32.
gateway = ["dep:djs-gateway", "hyper"]
## `zstd-stream` gateway transport compression (D-015).
zstd-stream = ["gateway", "djs-gateway/zstd-stream"]
## `zlib-stream` gateway transport compression (D-015, D-140; pure Rust).
zlib-stream = ["gateway", "djs-gateway/zlib-stream"]
## Also trust the operating system's root certificates (e.g. a corporate proxy's CA), in
## addition to the bundled `webpki-roots`, for REST and gateway connections (D-088, D-100).
native-roots = ["djs-gateway?/native-roots", "djs-rest/native-roots", "djs-voice?/native-roots"]
## Multi-process sharding, `djs_rs::sharding` (D-284): a `ClusterManager` runs the bot's
## shards in several processes of the same executable (D-296–D-304).
sharding = ["gateway", "dep:serde", "dep:serde_json", "tokio/io-util", "tokio/net", "tokio/process"]
## Voice, `djs_rs::voice` (D-315, D-345): joining voice channels and playing audio, with
## DAVE end-to-end encryption, through `client.voice()`.
voice = ["gateway", "dep:djs-voice"]
## HTTP interactions, `djs_rs::http_interactions` (D-395, D-398–D-402): answering the
## interactions Discord posts to the app's Interactions Endpoint URL with the same routes and
## handlers as a gateway bot, in any HTTP server (or a Cloudflare Workers `fetch` handler).
http-interactions = ["dep:ed25519-dalek", "dep:serde_json"]

[dependencies]
djs-builders.workspace = true
djs-cache.workspace = true
djs-collection.workspace = true
djs-formatters.workspace = true
djs-gateway = { workspace = true, optional = true }
djs-model.workspace = true
djs-rest.workspace = true
djs-voice = { workspace = true, optional = true }
ed25519-dalek = { workspace = true, optional = true, features = ["fast"] }
futures-core.workspace = true
serde = { workspace = true, features = ["derive", "std"], optional = true }
serde_json = { workspace = true, optional = true }
thiserror.workspace = true
tokio = { workspace = true, features = ["rt", "sync", "macros", "time"] }
tracing = { workspace = true, features = ["std"] }

[dev-dependencies]
bytes.workspace = true
divan.workspace = true
ed25519-dalek.workspace = true
futures-util = { workspace = true, features = ["sink", "std"] }
http-body-util.workspace = true
hyper = { workspace = true, features = ["server", "http1"] }
hyper-util = { workspace = true, features = ["tokio"] }
mimalloc.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["macros", "net", "rt-multi-thread", "signal", "time"] }
tokio-websockets = { workspace = true, features = ["server", "ring"] }
tracing-subscriber = { workspace = true, features = ["ansi", "env-filter", "fmt", "std"] }

[[example]]
name = "advanced"
required-features = ["gateway"]

[[example]]
name = "components"
required-features = ["gateway"]

[[example]]
name = "moderation"
required-features = ["gateway"]

[[example]]
name = "ping"
required-features = ["gateway"]

[[example]]
name = "slash_commands"
required-features = ["gateway"]

[[test]]
name = "http_interactions"
required-features = ["http-interactions"]

[[bench]]
name = "managers"
harness = false
required-features = ["gateway"]

[[bench]]
name = "sharding"
harness = false
required-features = ["sharding"]

[lints]
workspace = true

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
