# The guide (mdBook) and the API reference (rustdoc) on GitHub Pages — see
# docs/DECISIONS.md (D-377–D-382). Pull requests only build them; `main` publishes them at
# https://kotoanidev.github.io/djs-rs/ (the reference under `api/`).
name: Book

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# One deployment at a time: a newer push waits instead of cancelling one in progress.
concurrency:
  group: book-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  MDBOOK_VERSION: 0.5.4

jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install mdBook
        run: |
          mkdir -p "$HOME/.local/bin"
          curl -sSfL "https://github.com/rust-lang/mdBook/releases/download/v${MDBOOK_VERSION}/mdbook-v${MDBOOK_VERSION}-x86_64-unknown-linux-gnu.tar.gz" \
            | tar -xz -C "$HOME/.local/bin"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      # The listings the chapters include are examples of `book/code`, compiled by CI's
      # clippy and test jobs (D-378); a missing file or anchor fails the build here.
      - run: mdbook build book
      - name: Build the API reference
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --workspace --no-deps --all-features --exclude djs-vs-node --exclude djs-rs-guide
      - name: Put the reference in the site
        run: cp -r target/doc book/book/api
      - uses: actions/upload-pages-artifact@v5
        if: github.event_name != 'pull_request'
        with:
          path: book/book

  deploy:
    name: deploy
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
