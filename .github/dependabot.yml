# Weekly dependency updates (D-389). The comparison benchmarks (benches/vs-serenity,
# benches/vs-twilight) pin the libraries they compare on purpose and are not watched.
version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    labels: ["dependencies"]
    groups:
      cargo-minor-and-patch:
        update-types: ["minor", "patch"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    labels: ["dependencies"]
    # Its ref names a Rust toolchain (`stable`, the MSRV `1.89`), not a release of the action.
    ignore:
      - dependency-name: dtolnay/rust-toolchain
    groups:
      actions:
        patterns: ["*"]
